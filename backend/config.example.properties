# Copia este archivo como src/main/resources/config.properties (ignorado por Git)
# y llena los valores. Cada clave también se puede dar como variable de entorno:
# PRECIOGAS_ + la clave en mayúsculas con _ en vez de punto (db.host -> PRECIOGAS_DB_HOST).
# Si db.host (y db.url) están vacíos, la API responde con datos de ejemplo.

# Base de datos. TiDB Cloud: puerto 4000 y db.ssl=true (exige TLS).
# MySQL local: db.host=127.0.0.1, db.port=3306, db.ssl=false.
db.host=
db.port=4000
db.name=preciogas
db.ssl=true
db.user=
db.password=
# Opcional: URL JDBC completa; si la llenas, se ignoran db.host, db.port, db.name y db.ssl.
db.url=

# Nuestra gasolinera: centro de /resumen y del colector. 20.90/-101.30 son valores de
# ejemplo; con base configurada el colector no carga hasta que pongas los reales.
mi.lat=20.90
mi.lng=-101.30
# Permiso CNE (cre_id) de nuestra gasolinera: el colector no la guarda, así no entra a /resumen.
mi.permiso=

# Radio por omisión en km de /competencia y /resumen.
radio.default=10

# Colector: guarda las estaciones a este radio (km) de mi gasolinera.
# 100 = el máximo que acepta /competencia, para que nunca quede corta.
cne.radio.km=100
# Opcional: archivos de respaldo propios (.xml o .xml.gz) si la CNE no responde.
# Si están vacíos se usa la copia incluida en la WAR (resources/cne/*.xml.gz).
cne.archivo.places=
cne.archivo.prices=
# Corrida diaria automática del colector mientras Tomcat esté encendido (requiere base configurada).
# No sirve en hostings que apagan el servidor por inactividad (Render gratis).
colector.programado=false
colector.hora=07:00

# Zona horaria para la fecha de mis precios y de los precios de la CNE.
zona=America/Mexico_City

# POST /admin/actualizar pide el encabezado X-Admin-Token con este valor.
# Obligatorio si hay base de datos configurada (si falta, el endpoint responde 500).
admin.token=
