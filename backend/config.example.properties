# Copia este archivo como src/main/resources/config.properties (ignorado por Git)
# y llena los valores. También puedes usar variables de entorno:
#   PRECIOGAS_DB_URL, PRECIOGAS_DB_USER, PRECIOGAS_DB_PASSWORD, PRECIOGAS_MI_LAT, ...
# Si db.url está vacío, la API responde con datos de ejemplo.

# TiDB Cloud usa el puerto 4000 y exige TLS.
db.url=jdbc:mysql://<host>:4000/preciogas?sslMode=VERIFY_IDENTITY&useUnicode=true&characterEncoding=UTF-8
db.user=
db.password=

# Ubicación de nuestra gasolinera (centro de /resumen).
mi.lat=20.90
mi.lng=-101.30

# Radio por omisión en km.
radio.default=5

# Zona horaria para la fecha de mis precios.
zona=America/Mexico_City

# Opcional: si lo llenas, POST /admin/actualizar pide el encabezado X-Admin-Token con este valor.
admin.token=
