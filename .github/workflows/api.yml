name: API

on:
  push:
    paths: ["backend/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/api.yml"]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y correr pruebas
        run: ./mvnw -B package
